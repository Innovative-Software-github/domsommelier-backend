# Боевой конфиг: HTTP→HTTPS редирект + сама выдача по HTTPS, три домена
# на одном сервере — витрина, админка, API. Сертификаты — Let's Encrypt,
# пути стандартные (см. scripts/init-letsencrypt.sh).
events {}

http {
    # 127.0.0.11 — встроенный DNS docker-compose. Резолвим хосты контейнеров
    # через переменную в proxy_pass, а не статическим именем — иначе если
    # domsommelier-app/frontend/admin-frontend ещё не поднялся (или
    # перезапускался) в момент старта/reload nginx, он падает насмерть
    # с "host not found in upstream" вместо того чтобы просто отдать 502.
    resolver 127.0.0.11 valid=10s;

    # ── HTTP: только ACME-challenge и редирект на HTTPS ──
    server {
        listen 80;
        server_name devdomsomm.ru www.devdomsomm.ru admin.devdomsomm.ru api.devdomsomm.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Витрина (Next.js) ──
    server {
        listen 443 ssl;
        server_name devdomsomm.ru www.devdomsomm.ru;

        ssl_certificate     /etc/letsencrypt/live/devdomsomm.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devdomsomm.ru/privkey.pem;

        location / {
            set $frontend_upstream http://domsommelier-frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Админка (Vite/React) ──
    server {
        listen 443 ssl;
        server_name admin.devdomsomm.ru;

        ssl_certificate     /etc/letsencrypt/live/devdomsomm.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devdomsomm.ru/privkey.pem;

        location / {
            set $admin_upstream http://domsommelier-admin-frontend:80;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── API (Spring Boot) ──
    server {
        listen 443 ssl;
        server_name api.devdomsomm.ru;

        ssl_certificate     /etc/letsencrypt/live/devdomsomm.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devdomsomm.ru/privkey.pem;

        location /docs {
            set $app_upstream http://domsommelier-app:8080;
            proxy_pass $app_upstream/swagger-ui.html;
        }

        location / {
            set $app_upstream http://domsommelier-app:8080;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
