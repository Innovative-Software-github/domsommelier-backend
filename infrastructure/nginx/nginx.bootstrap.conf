# Временный конфиг для самого первого запуска — сертификатов ещё нет,
# только HTTP. Нужен, чтобы certbot смог пройти ACME http-01 challenge
# (см. scripts/init-letsencrypt.sh). После первого выпуска сертификатов
# nginx переключается на боевой nginx.conf (HTTP + HTTPS) и больше сюда
# не возвращается, кроме случая полной пересборки сервера с нуля.
events {}
http {
    server {
        listen 80;
        server_name devdomsomm.ru www.devdomsomm.ru admin.devdomsomm.ru api.devdomsomm.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'domsommelier: ожидание выпуска сертификатов...';
            add_header Content-Type text/plain;
        }
    }
}
