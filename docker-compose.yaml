version: '3.9'

services:
  nginx:
    image: nginx:latest
    container_name: reverse_proxy
    ports:
      - "${REVERSE_PROXY_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    depends_on:
      - domsommelier-app

  domsommelier-app:
    build: .
    ports:
      - "${API_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_DOMAIN}:${POSTGRES_PORT}/domsommelier
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL-AUTO=create-drop
      - MINIO_URL=http://${MINIO_DOMAIN}:${MINIO_API_PORT}
      - MINIO_ACCESS_NAME=${MINIO_ROOT_USER}
      - MINIO_ACCESS_SECRET=${MINIO_ROOT_PASSWORD}
      - SPRING_REDIS_HOST=${REDIS_DOMAIN}
      - SPRING_REDIS_PORT=${REDIS_PORT}
      - SPRING_SQL_INIT_MODE=always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server --console-address ":${MINIO_WEB_PORT}" /data/
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_WEB_PORT}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-storage:/data
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./infrastructure/db/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10
    depends_on:
      - minio
    networks:
      - app-network

  redis:
    image: redis:latest
    restart: always
    command: redis-server
    volumes:
      - cache:/cache-data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "ping" ]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  minio-storage:
  cache:
