services:

  # ── Vault — secret storage ──
  vault:
    image: hashicorp/vault:1.14
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./vault/config:/vault/config
    entrypoint: ["sh", "-c", "chown -R vault:vault /vault/data && docker-entrypoint.sh server"]
    healthcheck:
      test: ["CMD-SHELL", "vault status 2>&1 | grep -q 'Seal Type'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  # ── Vault initializer (runs once, then exits) ──
  vault-init:
    image: hashicorp/vault:1.14
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
    volumes:
      - ./vault/scripts/init-vault.sh:/scripts/init-vault.sh:ro
      - ./vault:/vault-config:ro
      - vault-keys:/vault/keys
      - vault-secrets:/run/secrets
    entrypoint: ["sh", "/scripts/init-vault.sh"]
    restart: "no"
    networks:
      - app-network

  # ── Nginx reverse proxy ──
  # Домен devdomsomm.ru — свой (не domsommelier.ru заказчика, тот пока не
  # используем). nginx.conf — финальный конфиг (HTTP+HTTPS, домены).
  # nginx.bootstrap.conf — временный HTTP-only конфиг для самого первого
  # выпуска сертификатов (см. scripts/init-letsencrypt.sh), нужен один раз,
  # пока сертификатов ещё нет — до этого момента сервис не поднимаем, иначе
  # nginx.conf упадёт (ssl_certificate ссылается на несуществующие файлы).
  # Прямые ports у domsommelier-frontend/domsommelier-admin-frontend ниже
  # можно продолжать использовать для отладки — не мешают nginx.
  nginx:
    image: nginx:latest
    container_name: reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - app-network
    depends_on:
      - domsommelier-app
      - domsommelier-frontend
      - domsommelier-admin-frontend

  # ── Certbot — выпуск и продление Let's Encrypt сертификатов ──
  # Разово выпустить сертификаты: см. scripts/init-letsencrypt.sh.
  # Дальше этот сервис раз в 12 часов сам проверяет срок и продлевает,
  # nginx отдельно нужно перечитать конфиг после продления (docker exec ... nginx -s reload).
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  # ── Клиентский сайт (Next.js) ──
  domsommelier-frontend:
    build:
      context: ../domsommelier-frontend
      args:
        # Нужен именно здесь (build-time), а не только в environment ниже —
        # next.config.ts запекает адрес бэкенда в rewrites() во время сборки.
        BROWSER_BACKEND_SERVER: domsommelier-app:8080
    environment:
      # Для прямых серверных fetch (getBackendHost() в customFetch.ts) —
      # этот путь читает env в рантайме корректно, в отличие от rewrites().
      - BROWSER_BACKEND_SERVER=domsommelier-app:8080
    # Порт наружу — пока нет домена/nginx-роутинга, ходим прямо по IP:3000.
    # Убрать (или оставить — не мешает), когда подключим nginx с доменом.
    ports:
      - "3000:3000"
    depends_on:
      - domsommelier-app
    restart: unless-stopped
    networks:
      - app-network

  # ── Админка (Vite/React) ──
  # Яндекс.Карты в форме винотеки работают без API-ключа (неавторизованный
  # режим, как и на витрине domsommelier-frontend) — сознательно, чтобы не
  # держать лишний секрет.
  domsommelier-admin-frontend:
    build:
      context: ../domsommelier-admin-frontend
    # Порт наружу — пока нет домена/nginx-роутинга, ходим прямо по IP:8081.
    ports:
      - "8081:80"
    depends_on:
      - domsommelier-app
    restart: unless-stopped
    networks:
      - app-network

  # ── Spring Boot application ──
  domsommelier-app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      # Разово поставить true в .env на сервере, чтобы засеять тестовые данные
      # (города/товары/фильтры/винотеки), затем вернуть в false и перезапустить —
      # иначе при каждом рестарте контейнера попытается вставить те же строки
      # заново и упадёт на дубликатах.
      - DB_INIT_MODE=${DB_INIT_MODE:-false}
    volumes:
      - vault-secrets:/run/secrets:ro
      - ./vault/scripts/app-entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["sh", "/app/entrypoint.sh"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  # ── MinIO object storage ──
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-storage:/data
      - vault-secrets:/run/secrets:ro
      - ./vault/scripts/minio-entrypoint.sh:/scripts/minio-entrypoint.sh:ro
    entrypoint: ["sh", "/scripts/minio-entrypoint.sh"]
    command: ["server", "--console-address", ":9001", "/data/"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks:
      - app-network

  # ── PostgreSQL database ──
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB_FILE=/run/secrets/db_name
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/db/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
      - db-data:/var/lib/postgresql/data
      - vault-secrets:/run/secrets:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      vault-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  # ── Redis cache ──
  redis:
    image: redis:latest
    restart: always
    command: redis-server
    volumes:
      - cache:/cache-data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  minio-storage:
  cache:
  vault-data:
  vault-keys:
  vault-secrets:
  certbot-etc:
  certbot-webroot:
